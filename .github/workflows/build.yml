name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-14
            artifact: RoyalRumble-macOS
          - name: Windows (x64)
            os: windows-latest
            artifact: RoyalRumble-Windows

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DRR_INSTALL_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # macOS produces a universal VST3 and an Audio Unit.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R "build/RoyalRumble_artefacts/Release/VST3/Royal Rumble.vst3" dist/
          cp -R "build/RoyalRumble_artefacts/Release/AU/Royal Rumble.component" dist/
          cp README.md LICENSE THIRD-PARTY.md dist/
          lipo -archs "dist/Royal Rumble.vst3/Contents/MacOS/Royal Rumble"
          ditto -c -k --sequesterRsrc --keepParent dist "${{ matrix.artifact }}.zip"

      # Windows gets VST3 only - Audio Units are a macOS format.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/RoyalRumble_artefacts/Release/VST3/Royal Rumble.vst3" dist/
          Copy-Item README.md, LICENSE, THIRD-PARTY.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
          body: |
            Download the build for your system below.

            **macOS** — universal (Apple Silicon + Intel). The binaries are not
            notarised, so on first load macOS will say the developer cannot be
            verified. To clear that, run:

            ```
            xattr -dr com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/Royal Rumble.vst3"
            ```

            **Windows** — VST3, x64.
